<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer login — SRIVI MART</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login-portal.css" />
</head>
<body class="lp-body">
  <div class="lp-wrap">
    <a class="lp-back" href="login.html">← All roles</a>
    <div class="lp-brand">
      <span class="lp-mark">S</span>
      <h1>Customer</h1>
    </div>
    <p class="lp-sub">Browse items, add to cart, set delivery address, and track your order. (Demo passwords stored locally).</p>

    <div class="lp-entity">
      <strong>DB reference — Users</strong>
      UserID (PK), Email, Phone, Address
    </div>

    <div class="lp-card">
      <div class="lp-tabs">
        <button type="button" class="lp-tab active" data-tab="in">Sign in</button>
        <button type="button" class="lp-tab" data-tab="up">Create account</button>
      </div>
      <div id="msg"></div>

      <form class="lp-form" id="formIn">
        <label>Email or mobile <input type="text" name="user" required autocomplete="username" /></label>
        <label>Password <input type="password" name="password" required autocomplete="current-password" /></label>
        <button type="submit" class="lp-btn">Sign in &amp; shop</button>
      </form>

      <form class="lp-form" id="formUp" hidden>
        <label>Full name <input type="text" name="name" required /></label>
        <label>Mobile number <input type="tel" name="phone" required /></label>
        <label>Email address <input type="email" name="email" required autocomplete="email" /></label>
        <label>Delivery address (optional) <textarea name="address" rows="2" placeholder="Door no., street, area..."></textarea></label>
        <label>
          Password
          <div class="lp-row">
            <input type="text" name="password" id="pwUp" required autocomplete="new-password" />
            <button type="button" class="lp-gen" id="genUp">Generate</button>
          </div>
        </label>
        <button type="submit" class="lp-btn">Register &amp; continue</button>
      </form>

      <p class="lp-hint">After login you will be redirected to the store to start shopping.</p>
    </div>
  </div>
  <script src="js/auth-common.js"></script>
  <script>
(function () {
  var msg = document.getElementById("msg");
  function show(text, ok) {
    msg.innerHTML = text ? '<p class="lp-msg ' + (ok ? "ok" : "err") + '">' + text + "</p>" : "";
  }
  document.querySelectorAll(".lp-tab").forEach(function (t) {
    t.addEventListener("click", function () {
      document.querySelectorAll(".lp-tab").forEach(function (x) { x.classList.toggle("active", x === t); });
      var up = t.getAttribute("data-tab") === "up";
      document.getElementById("formIn").hidden = up;
      document.getElementById("formUp").hidden = !up;
      show("");
    });
  });
  document.getElementById("genUp").addEventListener("click", function () {
    document.getElementById("pwUp").value = SriviAuth.generatePassword(12);
  });
  
  var params = new URLSearchParams(window.location.search);
  var nextUrl = params.get('next') || "index.html";

  document.getElementById("formIn").addEventListener("submit", function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var r = SriviAuth.loginCustomer(fd.get("user"), fd.get("password"));
    if (!r.ok) return show(r.msg, false);
    var u = r.user;
    SriviAuth.setSession({
      role: "customer",
      userId: u.userId,
      name: u.name,
      email: u.email,
      phone: u.phone,
      address: u.address,
    });
    show("Welcome back. Redirecting…", true);
    setTimeout(function () { location.href = nextUrl; }, 400);
  });
  document.getElementById("formUp").addEventListener("submit", function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var r = SriviAuth.registerCustomer({
      name: (fd.get("name") || "").trim(),
      phone: (fd.get("phone") || "").trim(),
      email: fd.get("email"),
      address: (fd.get("address") || "").trim(),
      password: fd.get("password"),
    });
    if (!r.ok) return show(r.msg, false);
    var u = r.user;
    SriviAuth.setSession({
      role: "customer",
      userId: u.userId,
      name: u.name,
      email: u.email,
      phone: u.phone,
      address: u.address,
    });
    show("Account created. Redirecting…", true);
    setTimeout(function () { location.href = nextUrl; }, 400);
  });
})();
  </script>
</body>
</html>
